<!doctype html>
<meta charset="utf-8" />
<title>WebGPU trial decryption bench</title>
<pre id="log">running… (?n=16384 outputs, two viewing keys)</pre>
<script type="module">
  import init, * as wasm from "./pkg/webgpu_decrypt_bench.js";
  import { WGSL, Q, LAMBDA, toMont, fromMont, mod, P } from "./shader.js";

  const params = new URLSearchParams(location.search);
  const N = Number(params.get("n") ?? 16384);
  const WG = Number(params.get("wg") ?? 64);
  const ROUNDS = 5;
  const lines = [];
  const log = (s) => {
    lines.push(s);
    document.getElementById("log").textContent = lines.join("\n");
  };
  const median = (xs) => xs.toSorted((a, b) => a - b)[xs.length >> 1];
  const time = async (f, rounds = ROUNDS) => {
    const ts = [];
    for (let i = 0; i < rounds; i++) {
      const t = performance.now();
      await f();
      ts.push(performance.now() - t);
    }
    return median(ts);
  };
  const leToBig = (b, o) => {
    let v = 0n;
    for (let i = 31; i >= 0; i--) v = (v << 8n) | BigInt(b[o + i]);
    return v;
  };
  const rand125 = () => {
    const w = crypto.getRandomValues(new Uint32Array(4));
    return ((BigInt(w[0]) << 96n) | (BigInt(w[1]) << 64n) | (BigInt(w[2]) << 32n) | BigInt(w[3])) >> 3n;
  };
  const wnaf = (k) => {
    const d = new Int32Array(128);
    for (let i = 0; k > 0n; i++, k >>= 1n) {
      if (k & 1n) {
        let x = Number(k & 15n);
        if (x >= 8) x -= 16;
        d[i] = x;
        k -= BigInt(x);
      }
    }
    return d;
  };

  // Two viewing keys k = k1 + λ·k2 with short halves, so the GPU gets its GLV
  // split directly while wasm decomposes k itself; the products must agree.
  const halves = [0, 1].map(() => [rand125(), rand125()]);
  const ks = halves.map(([a, b]) => mod(a + LAMBDA * b, Q));
  const scalarBytes = new Uint8Array(64);
  ks.forEach((k, j) => {
    for (let i = 0; i < 32; i++) scalarBytes[j * 32 + i] = Number((k >> BigInt(8 * i)) & 255n);
  });
  const digits = new Int32Array(512);
  halves.forEach(([a, b], j) => {
    digits.set(wnaf(a), j * 256);
    digits.set(wnaf(b), j * 256 + 128);
  });

  await init();
  const pts = wasm.setup(N, scalarBytes);
  log(`${navigator.userAgent}\ncores ${navigator.hardwareConcurrency}, n = ${N} outputs × 2 viewing keys\n`);

  // wasm, one thread: orchard's batch decrypt, then each step apart.
  const steps = {};
  steps.full = await time(() => wasm.full(), 3);
  steps.decode = await time(() => wasm.decode());
  steps.tables = await time(() => wasm.tables());
  steps.agree = await time(() => wasm.agree());
  steps.normalize = await time(() => wasm.normalize());
  steps.kdf = await time(() => wasm.kdf_and_decrypt());
  const ref = wasm.normalize();
  log("wasm, one thread (ms):");
  for (const [k, v] of Object.entries(steps)) log(`  ${k.padEnd(10)} ${v.toFixed(1)}`);
  const sum = steps.decode + steps.tables + steps.agree + steps.normalize + steps.kdf;
  log(`  steps sum  ${sum.toFixed(1)}  (scalar mul = tables + agree = ${(((steps.tables + steps.agree) / steps.full) * 100).toFixed(0)}% of full)`);

  // WebGPU: the key agreement only (tables + agree above).
  const adapter = await navigator.gpu?.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) {
    log("\nno WebGPU adapter");
    window.results = { steps, N };
    throw new Error("no WebGPU");
  }
  const device = await adapter.requestDevice();
  const info = adapter.info ?? {};
  log(`\nWebGPU: ${info.vendor} ${info.architecture} ${info.description ?? ""}`);

  const ptsLimbs = new Uint32Array(N * 40);
  for (let i = 0; i < N; i++) {
    ptsLimbs.set(toMont(leToBig(pts, i * 64)), i * 40);
    ptsLimbs.set(toMont(leToBig(pts, i * 64 + 32)), i * 40 + 20);
  }
  const buf = (data, usage) => {
    const b = device.createBuffer({ size: Math.max(16, data.byteLength), usage: usage | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(b, 0, data);
    return b;
  };
  const S = GPUBufferUsage.STORAGE;
  const outSize = N * 2 * 60 * 4;
  const out = device.createBuffer({ size: outSize, usage: S | GPUBufferUsage.COPY_SRC });
  const read = device.createBuffer({ size: outSize, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const t0 = performance.now();
  const module = device.createShaderModule({ code: WGSL.replace("@workgroup_size(64)", `@workgroup_size(${WG})`) });
  const pipeline = await device.createComputePipelineAsync({ layout: "auto", compute: { module, entryPoint: "main" } });
  const compileMs = performance.now() - t0;
  const pointsBuf = buf(ptsLimbs, S);
  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: pointsBuf } },
      { binding: 1, resource: { buffer: buf(digits, S) } },
      { binding: 2, resource: { buffer: out } },
      { binding: 3, resource: { buffer: buf(new Uint32Array([N, 0, 0, 0]), GPUBufferUsage.UNIFORM) } },
    ],
  });
  const run = async () => {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bind);
    pass.dispatchWorkgroups(Math.ceil(N / WG));
    pass.end();
    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
  };
  await run();
  const gpuMs = await time(run);
  const e2eMs = await time(async () => {
    device.queue.writeBuffer(pointsBuf, 0, ptsLimbs);
    await run();
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(out, 0, read, 0, outSize);
    device.queue.submit([enc.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    read.getMappedRange();
    read.unmap();
  });

  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(out, 0, read, 0, outSize);
  device.queue.submit([enc.finish()]);
  await read.mapAsync(GPUMapMode.READ);
  const res = new Uint32Array(read.getMappedRange().slice(0));
  read.unmap();

  // Jacobian (X, Y, Z) against wasm's affine (x, y): X = x·Z², Y = y·Z³.
  let bad = 0;
  for (let k = 0; k < 2; k++)
    for (let i = 0; i < N; i++) {
      const o = (i * 2 + k) * 60;
      const [X, Y, Z] = [0, 20, 40].map((d) => fromMont(Array.from(res.subarray(o + d, o + d + 20))));
      const x = leToBig(ref, (k * N + i) * 64);
      const y = leToBig(ref, (k * N + i) * 64 + 32);
      const z2 = (Z * Z) % P;
      if ((x * z2) % P !== X || (((y * z2) % P) * Z) % P !== Y) bad++;
    }
  log(`  shader compile ${compileMs.toFixed(0)} ms (once)`);
  log(`  key agreement ${gpuMs.toFixed(1)} ms for ${N} × 2  =  ${((gpuMs / N) * 1000).toFixed(1)} µs/output`);
  log(`  vs wasm one thread tables+agree ${(steps.tables + steps.agree).toFixed(0)} ms: ${((steps.tables + steps.agree) / gpuMs).toFixed(1)}×`);
  log(`  with upload + readback ${e2eMs.toFixed(1)} ms  (workgroup ${WG})`);
  log(`  mismatches vs wasm: ${bad} / ${2 * N}`);
  window.results = { steps, N, WG, gpuMs, e2eMs, compileMs, bad, adapter: info };
  if (params.get("cpu") === "0") throw new Error("done (cpu=0)");
  // wasm, every core: what sync runs today.
  const cores = navigator.hardwareConcurrency;
  const workers = Array.from({ length: cores }, () => new Worker("./worker.js", { type: "module" }));
  const call = (w, msg) => new Promise((r) => ((w.onmessage = (e) => r(e.data)), w.postMessage(msg)));
  await Promise.all(workers.map((w) => call(w, { n: N, scalars: scalarBytes })));
  const wall = await time(() => Promise.all(workers.map((w) => call(w, "full"))), 3);
  workers.forEach((w) => w.terminate());
  const cpuPerOutput = wall / (cores * N);
  log(`\nwasm, ${cores} workers: ${cores}×${N} outputs in ${wall.toFixed(0)} ms = ${(cpuPerOutput * 1000).toFixed(1)} µs/output`);

  const share = (steps.tables + steps.agree) / steps.full;
  log(`  vs wasm ${cores} workers' scalar-mul share (${((cpuPerOutput * share) * 1000).toFixed(1)} µs/output): ${((cpuPerOutput * share) / (gpuMs / N)).toFixed(1)}×`);
  window.results = { ...window.results, wall, cores };
</script>
