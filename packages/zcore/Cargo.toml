[package]
name = "zcore"
version = "0.1.0"
authors = ["Heliax"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/heliaxdev/zillions-interface"
description = "Zillions wallet core: keys, shielded trial decryption and transparent derivation, on NU6.3"
edition = "2021"
rust-version = "1.88"

# Standalone: none of the old SDK workspace's pins apply here.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[profile.release]
opt-level = 3
lto = true

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
hex = "0.4"
# Decodes the new server's binary chunk header; records are sliced by hand.
postcard = { version = "1", default-features = false }

# Only the note-encryption + key surface: no proving circuits.
zcash_keys = { version = "0.16", default-features = false, features = ["orchard", "sapling", "transparent-inputs", "unstable"] }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false, features = ["transparent-inputs"] }
zcash_protocol = "0.10"
zcash_primitives = { version = "0.30", default-features = false, features = ["transparent-inputs"] }
# Shielding's PCZT roles: the app creates and proves, the keychain signs.
pczt = { version = "0.9", default-features = false, features = ["orchard", "transparent", "zcp-builder", "io-finalizer", "signer", "prover", "spend-finalizer", "tx-extractor"] }
bip32 = { version = "=0.6.0-pre.1", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
# wasm32 has no OS randomness: the browser's crypto supplies it.
getrandom = { version = "0.2", features = ["js"] }
zcash_note_encryption = "0.4"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
orchard = { version = "0.15", default-features = false, features = ["std", "circuit"] }
# Pre-ZIP-212 Sapling notes carry their rcm as a scalar.
jubjub = "0.10"
ff = "0.13"
zip32 = { version = "0.2", default-features = false }

# Upstream wallet policy for sends: note selection, change, fees, ZIP 318.
# No sync, gRPC or tokio.
zcash_client_backend = { version = "0.24", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_address = "0.13"
incrementalmerkletree = "0.8"
nonempty = { version = "0.11", default-features = false }
# ziziphus bodies cross from JS as byte arrays.
serde_bytes = "0.11"

[dev-dependencies]
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
# Only the tests build spending keys and encrypt notes.
zcash_keys = { version = "0.16", features = ["orchard", "sapling", "transparent-inputs"] }
serde_json = "1"
