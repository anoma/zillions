[package]
name = "field-bench"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
bls12_381 = { version = "=0.9.0", default-features = false }
ff = "0.14"
pasta_curves = { version = "=0.6.1", default-features = false }

# Same as zcore's.
[profile.release]
opt-level = 3
lto = true

# Not part of zcore's workspace: build.sh picks crates.io or patched/ per build.
[workspace]
