name: wasm-trial

# Temporary: the flow from docs/design/wasm-ci-build.md, deploying nowhere, to
# time it. check, e2e and the production build use CI's wasm, not the committed
# pkg/. Delete once ci.yml and release-please.yml call build-wasm.yml.
on:
  pull_request:
    paths:
      - "packages/zcore/**"
      - ".github/workflows/build-wasm.yml"
      - ".github/workflows/wasm-trial.yml"
  workflow_dispatch:
    inputs:
      cache:
        description: Reuse cached builds. Off times a cold build.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  wasm:
    uses: ./.github/workflows/build-wasm.yml
    with:
      cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}

  check:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.wasm.outputs.artifact }}
          path: packages/zcore/pkg
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm app:test

  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.wasm.outputs.artifact }}
          path: packages/zcore/pkg
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      - id: playwright
        run: echo "version=$(pnpm --filter zillions-app exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter zillions-app exec playwright install --with-deps --only-shell chromium firefox
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter zillions-app exec playwright install-deps chromium firefox
      - run: pnpm app:e2e

  # What Netlify would publish: the keychain zip inside the app build.
  site:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.wasm.outputs.artifact }}
          path: packages/zcore/pkg
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      # Netlify sets these for production; the build fetches from the indexer.
      - run: cp apps/app/.env.example apps/app/.env
      - run: pnpm build
      - run: |
          {
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            for f in packages/zcore/pkg/zcore_bg.wasm apps/app/dist/zillions-keychain.zip; do
              echo "| \`$f\` | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo "\`apps/app/dist\`: $(du -sh apps/app/dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/app/dist
          retention-days: 14
