name: netlify-probe

# Temporary, read-only: the Netlify site's build settings, recent deploys and
# env var names (never values). Deploys nothing. Delete after the test.
on:
  pull_request:
    paths:
      - ".github/workflows/netlify-probe.yml"

permissions:
  contents: read

jobs:
  settings:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          api() { curl -sSf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1$1"; }
          site=$(api /sites/zillions-app.netlify.app)
          echo "$site" | jq '{name, url, build_image, published_deploy: .published_deploy | {branch, context, commit_ref, created_at},
            build: .build_settings | {provider, repo_url, repo_branch, base, cmd, dir, allowed_branches, skip_prs, stop_builds, installation_id: (.installation_id != null)}}'
          id=$(echo "$site" | jq -r .id)
          account=$(echo "$site" | jq -r .account_id)
          echo "recent deploys:"
          api "/sites/$id/deploys?per_page=12" | jq -r '.[] | [.created_at, .context, .branch, (.commit_ref // "-")[0:8], .state, .deploy_ssl_url] | @tsv'
          echo "env var names and contexts:"
          api "/accounts/$account/env?site_id=$id" | jq -r '.[] | "\(.key)\t\([.values[].context] | join(","))"'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
