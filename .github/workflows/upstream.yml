name: upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  crates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream crate updates"
          list=$(node packages/zcore/upstream-check.mjs)
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -z "$list" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "All current."; fi
            exit 0
          fi
          body=$(printf 'crates.io has newer releases than zcore uses. Rewritten daily by `.github/workflows/upstream.yml`.\n\n%s\n' "$list")
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
