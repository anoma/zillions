name: upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  crates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream crate updates"
          list=$(node packages/zcore/upstream-check.mjs)
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -z "$list" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "All current."; fi
            exit 0
          fi
          body=$(printf 'crates.io has newer releases than zcore uses. Rewritten daily by `.github/workflows/upstream.yml`.\n\n%s\n' "$list")
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
