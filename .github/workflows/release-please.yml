name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Netlify publishes zillions-app.netlify.app (app + bundled keychain zip) from `production`.
      - if: ${{ steps.release.outputs['apps/app--release_created'] || steps.release.outputs['apps/keychain--release_created'] }}
        uses: actions/checkout@v4
      - if: ${{ steps.release.outputs['apps/app--release_created'] || steps.release.outputs['apps/keychain--release_created'] }}
        run: git push -f origin HEAD:refs/heads/production
