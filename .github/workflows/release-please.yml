name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      keychain_release_created: ${{ steps.release.outputs['apps/keychain--release_created'] }}
      keychain_tag_name: ${{ steps.release.outputs['apps/keychain--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Netlify publishes zillions-app.netlify.app (app + bundled keychain zip) from `production`.
      - if: ${{ steps.release.outputs['apps/app--release_created'] || steps.release.outputs['apps/keychain--release_created'] }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: ${{ steps.release.outputs['apps/app--release_created'] || steps.release.outputs['apps/keychain--release_created'] }}
        run: git push -f origin HEAD:refs/heads/production

  keychain-zip:
    needs: release-please
    if: ${{ needs.release-please.outputs.keychain_release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.keychain_tag_name }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # No dependency runs code at install time (see ci.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      - run: pnpm keychain:zip
      - run: gh release upload "$TAG" apps/keychain/.output/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.keychain_tag_name }}
