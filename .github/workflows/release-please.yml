name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      keychain_release_created: ${{ steps.release.outputs['apps/keychain--release_created'] }}
      keychain_tag_name: ${{ steps.release.outputs['apps/keychain--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Netlify publishes zillions-app.netlify.app (app + bundled keychain zip) from `production`.
      - if: ${{ steps.release.outputs['apps/app--release_created'] || steps.release.outputs['apps/keychain--release_created'] }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ steps.release.outputs['apps/app--release_created'] || steps.release.outputs['apps/keychain--release_created'] }}
        run: git push -f origin HEAD:refs/heads/production

  keychain-zip:
    needs: release-please
    if: ${{ needs.release-please.outputs.keychain_release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # scripts/fetch-zcore.mjs reads build-wasm.yml's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.keychain_tag_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # No dependency runs code at install time (see ci.yml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      # The zip the stores get carries CI's build of zcore from main.
      - run: COMMIT_REF=$(git rev-parse HEAD) node scripts/fetch-zcore.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT: production
      - run: pnpm keychain:zip
      - run: gh release upload "$TAG" apps/keychain/.output/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.keychain_tag_name }}
