name: ci

on:
  pull_request:
  # Commits also land on main directly, outside PRs.
  push:
    branches:
      - main

# The default token only reads; no job here needs more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # No dependency runs code at install time. `wxt prepare` is the
      # keychain's own postinstall: it writes the types `tsc` needs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm app:test

  keychain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm keychain:build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The app imports keychain sources, whose tsconfig extends the
      # `.wxt/tsconfig.json` this writes.
      - run: pnpm --filter zillions-keychain exec wxt prepare
      - id: playwright
        run: echo "version=$(pnpm --filter zillions-app exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Headless runs need only Chromium's headless shell.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter zillions-app exec playwright install --with-deps --only-shell chromium firefox
      # The cache holds the browsers, not the system libraries they need.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter zillions-app exec playwright install-deps chromium firefox
      - run: pnpm app:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/app/test-results

  # Credentials committed by mistake, in the commits a PR adds (or a push).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
