name: ci

on:
  pull_request:
  # Commits also land on main directly, outside PRs.
  push:
    branches:
      - main

# The default token only reads; no job here needs more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # No dependency runs code at install time. `wxt prepare` is the
      # keychain's own postinstall: it writes the types `tsc` needs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter zillions-keychain exec wxt prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm app:test

  keychain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm keychain:build
      # The built extension may reach no site but the Zillions app.
      - run: node scripts/check-keychain-manifest.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: playwright
        run: echo "version=$(pnpm --filter zillions-app exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Headless runs need only Chromium's headless shell.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter zillions-app exec playwright install --with-deps --only-shell chromium firefox
      # The cache holds the browsers, not the system libraries they need.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter zillions-app exec playwright install-deps chromium firefox
      - run: pnpm app:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/app/test-results

  # Credentials committed by mistake, in the commits a PR adds (or a push).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
