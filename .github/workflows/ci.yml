name: ci

on:
  pull_request:
  # Commits also land on main directly, outside PRs.
  push:
    branches:
      - main

# The default token only reads; no job here needs more.
permissions:
  contents: read

jobs:
  # zcore's wasm isn't committed; every job below tests CI's build of it.
  wasm:
    uses: ./.github/workflows/build-wasm.yml

  check:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          zcore: ${{ needs.wasm.outputs.artifact }}
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm app:test
      - run: pnpm keychain:test

  keychain:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          zcore: ${{ needs.wasm.outputs.artifact }}
      - run: pnpm keychain:build

  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          zcore: ${{ needs.wasm.outputs.artifact }}
      - id: playwright
        run: echo "version=$(pnpm --filter zillions-app exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Headless runs need only Chromium's headless shell.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter zillions-app exec playwright install --with-deps --only-shell chromium firefox
      # The cache holds the browsers, not the system libraries they need.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter zillions-app exec playwright install-deps chromium firefox
      - run: pnpm app:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/app/test-results

  # Credentials committed by mistake, in the commits a PR adds (or a push).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --results=verified,unknown
