name: audit

# What the lockfile pulls in, against the advisory database. Advisories land
# without our code changing, so this also runs daily.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-pins.mjs
      # Reads the lockfile; nothing is installed. Only what ships to users
      # fails the build; dev tooling is reviewed from the full report below.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm audit
        continue-on-error: true
