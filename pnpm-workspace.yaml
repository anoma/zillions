packages:
  - apps/app
  - packages/*
  - apps/keychain
  - apps/keychain/src/packages/types
  - apps/keychain/examples/*

# No dependency runs code at install time; CI installs with --ignore-scripts.
# esbuild's postinstall only checks the binary its platform package ships.
ignoredBuiltDependencies:
  - esbuild

# Versions every package that uses them must share: reference them as
# `catalog:` so the app, the keychain and the test dapp can't drift apart.
catalog:
  "@fontsource-variable/montserrat": 5.3.0
  "@tailwindcss/vite": 4.3.3
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  eslint: 10.14.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.14.0
  react: 19.3.1
  react-dom: 19.3.1
  react-icons: 5.7.0
  tailwind-merge: 3.7.0
  tailwind-variants: 4.0.2
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.1.0
