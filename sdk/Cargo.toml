[workspace]
resolver = "2"

members = [
    "crates/zillions-sdk-common",
    "crates/zillions-sdk-keys",
    "crates/zillions-sdk-requests",
    "crates/zillions-sdk-wallet",
    "crates/zcash_client_memory",
]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = 3
lto = true
codegen-units = 1

[workspace.dependencies]
## Web dependencies
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = [
    "console",
] }
wasm-bindgen-rayon = { version = "1.3" } # Update to higher version cause playwright test in chtomium fail

# WASM specific dependencies
tracing-web = { version = "0.1.3" }
console_error_panic_hook = { version = "0.1.7" }
tonic-web-wasm-client = "0.8.0"
tokio_with_wasm = { version = "0.7.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

## Zcash dependencies - upstream zcash/librustzcash (NU6.2, branch ID 0x5437f330)
zcash_keys = { git = "https://github.com/zcash/librustzcash", branch = "main", features = ["transparent-inputs", "orchard", "sapling", "unstable"] }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard"] }
zcash_client_memory = { path = "crates/zcash_client_memory", features = ["orchard", "transparent-inputs"] }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", branch = "main" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false }
# Alias used by zcash_client_memory (zcash_transparent package, shorter name)
transparent = { package = "zcash_transparent", git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false }
zcash_address = { git = "https://github.com/zcash/librustzcash", branch = "main" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false, features = ["bundled-prover", "multicore"] }
zip321 = { git = "https://github.com/zcash/librustzcash", branch = "main" }
zip32 = { version = "0.2" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false }
pczt = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false, features = ["orchard", "sapling", "transparent"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
orchard = { version = "0.14", default-features = false, features = ["circuit"] }
bip32 = { version = "=0.6.0-pre.1", default-features = false, features = ["alloc"] }

# Extra deps required by zcash_client_memory (not in the zillions-sdk-wallet/keys crates directly)
incrementalmerkletree = { version = "0.8.2", default-features = false }
shardtree = { version = "0.6.1" }
bs58 = { version = "0.5", default-features = false, features = ["alloc", "check"] }
byteorder = "1"
group = "0.13"
jubjub = "0.10"
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }
zcash_script = { version = "0.4.2", default-features = false }
serde_json = "1"
static_assertions = "1.1"
time = "0.3"
which = "8"
proptest = { version = "1", default-features = false, features = ["std"] }

## gRPC Web dependencies
prost = { version = "0.14", default-features = false }
prost-build = "0.14"
tonic = { version = "0.14", default-features = false }

# Used in native tests only
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", branch = "main", default-features = false, features = ["unstable", "orchard"] }

getrandom = { version = "0.2", features = ["js"] }
thiserror = "1.0.63"
indexed_db_futures = "0.5.0"
sha2 = "0.10"
ripemd = "0.1"
bip0039 = "0.12.0"
secrecy = "0.8.0"
futures-util = "0.3.30"
nonempty = "0.11"
hex = "0.4.3"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"
rayon = { version = "1.8", features = ["web_spin_lock"] }
subtle = "2.6.1"
wasm_thread = { git = "https://github.com/ec2/wasm_thread", rev = "9e432077948d927d49373d1d039c23447d3648df", default-features = false, features = ["keep_worker_alive", "es_modules"] }

wasm_sync = "0.1.2"
http = { version = "1.1.0", default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
postcard = { version = "1.0.10", features = ["alloc"] }
serde-wasm-bindgen = "0.6.5"

wasm-bindgen-test = "=0.3.50"
tempfile = "3.12"
# Used in Native tests
tokio = { version = "1.0", features = ["rt", "macros"] }
byte-unit = { version = "5.1.4", features = ["byte"] }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen)', 'cfg(wasm_bindgen_unstable_test_coverage)', 'cfg(zcash_unstable, values("nu7", "zfuture"))'] }